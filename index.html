<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <link href="css/favicon.png" rel="icon" />
    <title>Ciao, Fiuggi</title>
    <!-- Подключаем Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Подключаем иконки Phosphor Icons (как альтернатива Lucide) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Небольшой фикс для имитации мобильного экрана на десктопе */
        body { background-color: #e5e7eb; }
        .app-container { max-width: 400px; margin: 0 auto; background-color: #f4f4f5; min-height: 100vh; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        /* Скрываем скроллбар для красоты */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

<div class="app-container pb-20">
    
    <!-- Шапка -->
    <div class="bg-white px-4 py-3 flex items-center gap-3 sticky top-0 z-10 rounded-b-3xl shadow-sm">
        <div class="bg-blue-900 text-white font-bold p-2 rounded-xl text-sm">CF</div>
        <div>
            <h1 class="font-bold text-lg leading-tight text-gray-900">Ciao Fiuggi</h1>
            <p class="text-xs text-gray-500">Фьюджи по-русски</p>
        </div>
    </div>

    <!-- Приветствие -->
    <div class="px-5 pt-6 pb-2">
        <h2 class="text-2xl font-bold text-gray-900 mb-2">Чем помочь сегодня?</h2>
        <p class="text-sm text-gray-600">Все нужные ссылки из нашего Telegram-канала в одном месте.</p>
    </div>

    <!-- Поиск -->
    <div class="px-4 mb-4">
        <div class="bg-white rounded-2xl p-3 flex items-center gap-2 text-gray-400 shadow-sm border border-gray-100">
            <i class="ph ph-magnifying-glass text-lg"></i>
            <input type="text" placeholder="Врач, автобус, коммуна..." class="bg-transparent border-none outline-none w-full text-sm text-gray-700 placeholder-gray-400">
        </div>
    </div>

    <!-- Экстренная кнопка (используем твою ссылку на полицию/медицину) -->
    <div class="px-4 mb-6">
        <a href="medic.html" class="bg-red-50 rounded-2xl p-4 flex items-center justify-between border border-red-100 active:scale-95 transition-transform block">
            <div class="flex items-center gap-3">
                <span class="text-red-600 font-bold text-xl">112</span>
                <span class="text-red-900 font-medium">Медицина и Полиция</span>
            </div>
            <span class="text-red-500 text-sm font-medium">Перейти</span>
        </a>
    </div>

    <div class="px-5 text-xs font-bold text-gray-400 uppercase tracking-wider mb-3">Разделы</div>

    <!-- Сетка карточек (Grid) - твои ссылки -->
    <div class="grid grid-cols-3 gap-3 px-4">
        
        <!-- Транспорт -->
        <a href="bus.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-bus text-2xl text-blue-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Автобусы</span>
        </a>

        <a href="train.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-train text-2xl text-blue-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Поезда</span>
        </a>

        <a href="local.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-taxi text-2xl text-blue-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">По городу</span>
        </a>

        <!-- Администрация -->
        <a href="comuna.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-bank text-2xl text-indigo-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Комуна</span>
        </a>

        <a href="tax.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-receipt text-2xl text-indigo-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Налоги</span>
        </a>

        <a href="condo.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-buildings text-2xl text-indigo-600"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Кондоминиум</span>
        </a>

        <!-- Отдых -->
        <a href="restorans.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-fork-knife text-2xl text-orange-500"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Рестораны</span>
        </a>

        <a href="art.html" class="bg-white rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-gray-50 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-palette text-2xl text-orange-500"></i>
            <span class="text-xs font-medium text-gray-800 leading-tight">Культура</span>
        </a>

        <a href="https://t.me/+Ij9VSaLKI-8xYmUy" target="_blank" class="bg-blue-50 rounded-2xl p-3 flex flex-col items-center justify-center gap-2 shadow-sm border border-blue-100 aspect-square active:scale-95 transition-transform text-center">
            <i class="ph ph-telegram-logo text-2xl text-blue-500"></i>
            <span class="text-xs font-medium text-blue-700 leading-tight">Чат Фьюджи</span>
        </a>

    </div>

    <!-- Нижнее меню навигации (Fixed Bottom Bar) -->
    <div class="fixed bottom-0 w-full max-w-[400px] bg-white border-t border-gray-100 flex justify-around p-2 pb-5 z-20">
        <a href="#" class="flex flex-col items-center gap-1 p-2 text-blue-900">
            <i class="ph-fill ph-house text-xl"></i>
            <span class="text-[10px] font-bold">Главная</span>
        </a>
        <a href="#" class="flex flex-col items-center gap-1 p-2 text-gray-400 hover:text-blue-900 transition-colors">
            <i class="ph ph-magnifying-glass text-xl"></i>
            <span class="text-[10px] font-medium">Поиск</span>
        </a>
        <a href="https://t.me/+Ij9VSaLKI-8xYmUy" target="_blank" class="flex flex-col items-center gap-1 p-2 text-gray-400 hover:text-blue-900 transition-colors">
            <i class="ph ph-users text-xl"></i>
            <span class="text-[10px] font-medium">Группа</span>
        </a>
    </div>

</div>

</body>
</html>
